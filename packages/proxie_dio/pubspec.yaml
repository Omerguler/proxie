name: proxie_dio
description: Dio interceptor adapter for Proxie, the in-app HTTP inspector for Flutter. Captures Dio requests and responses into the Proxie overlay.
version: 0.1.0
repository: https://github.com/Omerguler/proxie
issue_tracker: https://github.com/Omerguler/proxie/issues
topics:
  - dio
  - http
  - debugging
  - network
  - inspector
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  proxie: ^0.1.0
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
