name: proxie
description: In-app HTTP inspector for Flutter. Capture, inspect, mock, and breakpoint network calls from a debug overlay, with sensitive data masked.
version: 0.1.0
repository: https://github.com/Omerguler/proxie
issue_tracker: https://github.com/Omerguler/proxie/issues
topics:
  - http
  - debugging
  - network
  - inspector
  - proxy
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^3.8.0
  http: ^1.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
