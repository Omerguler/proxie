name: proxie
description: In-app HTTP inspector for Flutter. Capture, inspect, mock, and breakpoint calls from a debug overlay, masking credentials in headers, JSON, URLs and forms.
version: 0.1.0
repository: https://github.com/Omerguler/proxie/tree/main/packages/proxie
issue_tracker: https://github.com/Omerguler/proxie/issues
topics:
  - http
  - debugging
  - network
  - inspector
  - proxy
screenshots:
  - description: Call list with a JSON response open in the tree view, dark theme.
    path: doc/screenshots/dark-03-list-detail-json-1280.png
  - description: Timing tab of a call, with duration, state, adapter and sizes.
    path: doc/screenshots/dark-05-timing.png
  - description: A POST request paused at a breakpoint, ready to edit, abort or continue.
    path: doc/screenshots/dark-18-breakpoint-editor.png
  - description: Call list with a JSON response open in the tree view, light theme.
    path: doc/screenshots/light-03-list-detail-json-1280.png
  - description: Call list at phone width, with a BREAK chip on a call that was paused.
    path: doc/screenshots/dark-21-phone-list.png
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  sqlite3: ^3.5.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  very_good_analysis: 11.0.0
